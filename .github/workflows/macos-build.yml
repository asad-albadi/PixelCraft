name: macOS native build and startup

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      PIXELCRAFT_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Build native Lua and WebP
        run: bash packaging/build-macos-runtime.sh "${{ matrix.arch }}"
      - name: Format, lint, and test
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-macos-test-data
        run: |
          cargo +1.95.0 fmt --check
          cargo +1.95.0 clippy --locked --all-targets -- -D warnings
          cargo +1.95.0 test --release --locked --all-targets
          cargo +1.95.0 build --release --locked
      - name: Stage and archive the macOS application
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="manual-${GITHUB_SHA:0:7}"
          fi
          version=$(printf '%s' "$version" | sed 's/[^A-Za-z0-9._-]/-/g')
          cargo_version=$(cargo +1.95.0 metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pixelcraft"))')
          bash packaging/build-macos-bundle.sh target/release/pixelcraft dist "$version" "$cargo_version" "${{ matrix.arch }}"
          echo "MACOS_ARCHIVE=dist/PixelCraft-$version-macos-${{ matrix.arch }}.zip" >> "$GITHUB_ENV"
      - name: Verify packaged Lua, WebP, and graphical startup
        run: python3 checks/macos-package.py "$MACOS_ARCHIVE" "$RUNNER_TEMP/pixelcraft-macos-smoke" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: PixelCraft-macOS-${{ matrix.arch }}-startup
          path: |
            ${{ runner.temp }}/pixelcraft-macos-smoke/*.log
            ${{ runner.temp }}/pixelcraft-macos-smoke/startup.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PixelCraft-macOS-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
