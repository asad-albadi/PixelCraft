name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pixelcraft-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  macos:
    uses: ./.github/workflows/macos-build.yml

  linux:
    name: Linux checks
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgl1-mesa-dev libegl1-mesa-dev libwebp-dev
      - name: Install Rust checks
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
      - name: Format, lint, and test
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-pr-data
        run: |
          python3 checks/workspace-boundaries.py
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo test --workspace --locked

  windows:
    name: Windows checks and startup
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install Rust checks
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Build static WebP
        run: ./packaging/build-windows-webp.ps1
      - name: Verify workspace boundaries
        run: python checks/workspace-boundaries.py
      - name: Format
        run: cargo +1.95.0 fmt --all --check
      - name: Lint
        run: cargo +1.95.0 clippy --workspace --locked --all-targets -- -D warnings
      - name: Test
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-pr-data
        run: cargo +1.95.0 test --workspace --locked
      - name: Build application
        run: |
          cargo +1.95.0 build --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python checks/no-lua-runtime.py target/debug/pixelcraft.exe
      - name: Smoke-test single-executable operation
        run: ./checks/windows-portable.ps1 -App target/debug/pixelcraft.exe
      - name: Open the Windows application
        run: ./checks/graphics-fallback.ps1 -App target/debug/pixelcraft.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: PixelCraft-Windows-PR-startup
          path: |
            ${{ runner.temp }}/pixelcraft-fallback/*.log
            ${{ runner.temp }}/pixelcraft-fallback/*.png
          if-no-files-found: ignore
