name: Desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      PIXELCRAFT_REPOSITORY: ${{ github.repository }}
      PIXELCRAFT_DEVELOPER: ${{ github.repository_owner }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libegl1-mesa-dev liblua5.4-dev \
            desktop-file-utils patchelf xvfb xauth weston \
            libgl1-mesa-dri libegl-mesa0 python3-pil

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable

      # The checked-in development Lua binary requires a newer glibc.
      # Embed Ubuntu's Lua instead so the release supports Ubuntu 22.04+.
      - name: Use release-compatible embedded Lua
        run: cp -L /usr/lib/x86_64-linux-gnu/liblua5.4.so.0 runtime/liblua5.4.so

      - name: Test and build release
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-native-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/pixelcraft-native-config
        run: |
          cargo test --locked
          cargo build --release --locked
          target/release/pixelcraft --standalone-check "$RUNNER_TEMP/pixelcraft-native-check"

      - name: Set artifact version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="manual-${GITHUB_SHA:0:7}"
          fi
          # Git refs may contain characters that are unsafe in filenames.
          version=$(printf '%s' "$version" | sed 's/[^A-Za-z0-9._-]/-/g')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "OUTPUT=PixelCraft-${version}-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Package AppImage
        shell: bash
        run: |
          mkdir -p dist AppDir/usr/share/doc/pixelcraft
          install -m 644 LICENSE AppDir/usr/share/doc/pixelcraft/LICENSE
          install -m 644 runtime/LUA-LICENSE.txt AppDir/usr/share/doc/pixelcraft/LUA-LICENSE.txt
          desktop-file-validate packaging/pixelcraft.desktop
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output "$RUNNER_TEMP/linuxdeploy.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy.AppImage"
          # X11 is loaded dynamically. Wayland must come from the host, together
          # with its Mesa/EGL drivers, to avoid mixing incompatible Wayland ABIs.
          "$RUNNER_TEMP/linuxdeploy.AppImage" --appdir AppDir \
            --executable target/release/pixelcraft \
            --desktop-file packaging/pixelcraft.desktop \
            --icon-file packaging/pixelcraft.png \
            --library /usr/lib/x86_64-linux-gnu/libX11.so.6 \
            --exclude-library 'libwayland-*.so*' \
            --library /usr/lib/x86_64-linux-gnu/libxkbcommon.so.0 \
            --library /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0 \
            --output appimage
          # Also catch accidental/transitive bundling, including symlinks.
          bundled_wayland=$(find AppDir -name 'libwayland-*.so*' -print)
          if [[ -n "$bundled_wayland" ]]; then
            echo "Wayland libraries must be supplied by the host:" >&2
            printf '%s\n' "$bundled_wayland" >&2
            exit 1
          fi
          mv "$OUTPUT" dist/

      - name: Smoke test packaged app and create checksum
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-appimage-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/pixelcraft-appimage-config
        shell: bash
        run: |
          chmod +x "dist/$OUTPUT"
          "dist/$OUTPUT" --standalone-check "$RUNNER_TEMP/pixelcraft-appimage-check"
          cd dist
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

      - name: Graphical startup on X11
        shell: bash
        run: |
          env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x960x24 +extension GLX' \
            bash checks/graphical-startup.sh "dist/$OUTPUT" "$RUNNER_TEMP/startup-x11"

      - name: Graphical startup on native Wayland
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/pixelcraft-wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=pixelcraft-test
          weston --backend=headless-backend.so --use-gl --no-config \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 --width=1280 --height=960 \
            --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/weston.log"
              exit 1
            fi
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat "$RUNNER_TEMP/weston.log"
            echo 'Wayland compositor did not become ready.' >&2
            exit 1
          fi
          # Removing DISPLAY prevents a successful X11 fallback hiding a failure.
          env -u DISPLAY -u WAYLAND_SOCKET bash checks/graphical-startup.sh \
            "dist/$OUTPUT" "$RUNNER_TEMP/startup-wayland"

      - name: Upload graphical startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-startup-diagnostics
          path: |
            ${{ runner.temp }}/startup-x11/startup.*
            ${{ runner.temp }}/startup-wayland/startup.*
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PIXELCRAFT_REPOSITORY: ${{ github.repository }}
      PIXELCRAFT_DEVELOPER: ${{ github.repository_owner }}
      # Statically link the MSVC runtime so a separate redistributable is unnecessary.
      RUSTFLAGS: '-C target-feature=+crt-static'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup override set stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }
      - name: Build embedded Windows Lua
        run: ./packaging/build-windows-lua.ps1
      - name: Test and build Windows release
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-native-data
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Package Windows installer
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read app version' }
          $appVersion = ($metadata.packages | Where-Object name -eq pixelcraft).version
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'manual-' + $env:GITHUB_SHA.Substring(0,7) }
          $version = $version -replace '[^A-Za-z0-9._-]', '-'
          $output = "PixelCraft-$version-x86_64-Setup"
          "OUTPUT=$output.exe" >> $env:GITHUB_ENV
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is missing from the Windows runner' }
          & $compiler "/DAppVersion=$appVersion" "/DOutputName=$output" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify installed app, uninstall and checksum
        run: ./checks/windows-installer.ps1 -Installer "dist/$env:OUTPUT"
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Windows-x86_64
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [appimage, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PixelCraft-Linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: PixelCraft-Windows-x86_64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "PixelCraft $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
