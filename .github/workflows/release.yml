name: Desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows_only:
        description: Build only the Windows test artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      PIXELCRAFT_REPOSITORY: ${{ github.repository }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwebp-dev \
            desktop-file-utils dpkg-dev binutils patchelf xvfb xauth weston sway \
            libgl1-mesa-dri libegl-mesa0 python3-pil

      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.95.0

      - name: Test and build release
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-native-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/pixelcraft-native-config
        run: |
          python3 checks/workspace-boundaries.py
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked
          python3 checks/no-lua-runtime.py target/release/pixelcraft
          target/release/pixelcraft --standalone-check "$RUNNER_TEMP/pixelcraft-native-check"

      - name: Native clipboard and automatic graphics fallback on Linux
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-clipboard-data
        run: |
          xvfb-run -a cargo test --locked -p pixelcraft-desktop --lib native_clipboard_roundtrip -- --ignored --nocapture --test-threads=1
          env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET xvfb-run -a cargo test --locked -p pixelcraft-desktop --lib x11_packed_tilemap_cross_process_roundtrip -- --ignored --nocapture
          WGPU_BACKEND=metal xvfb-run -a bash checks/graphical-startup.sh target/release/pixelcraft "$RUNNER_TEMP/fallback-linux"
          grep -F 'restarting with OpenGL' "$RUNNER_TEMP/fallback-linux/startup.log"

      - name: Packed clipboard on native Wayland
        env:
          WLR_BACKENDS: headless
          WLR_HEADLESS_OUTPUTS: '1'
          WLR_LIBINPUT_NO_DEVICES: '1'
          WLR_RENDERER: pixman
        run: |
          unset DISPLAY WAYLAND_DISPLAY WAYLAND_SOCKET
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/pixelcraft-clipboard-wayland"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          printf '%s\n' 'output * mode 1280x720' 'seat seat0 fallback true' > "$XDG_RUNTIME_DIR/sway.conf"
          sway --config "$XDG_RUNTIME_DIR/sway.conf" > "$RUNNER_TEMP/clipboard-sway.log" 2>&1 &
          sway_pid=$!
          trap 'kill "$sway_pid" 2>/dev/null || true; wait "$sway_pid" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            for socket in "$XDG_RUNTIME_DIR"/wayland-*; do
              if [[ -S "$socket" ]]; then
                export WAYLAND_DISPLAY="${socket##*/}"
                break 2
              fi
            done
            kill -0 "$sway_pid" 2>/dev/null || break
            sleep 0.1
          done
          if [[ -z "${WAYLAND_DISPLAY:-}" ]]; then
            cat "$RUNNER_TEMP/clipboard-sway.log"
            exit 1
          fi
          cargo test --locked -p pixelcraft-desktop --lib wayland_packed_tilemap_cross_process_roundtrip -- --ignored --nocapture

      - name: Set artifact version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="manual-${GITHUB_SHA:0:7}"
          fi
          # Git refs may contain characters that are unsafe in filenames.
          version=$(printf '%s' "$version" | sed 's/[^A-Za-z0-9._-]/-/g')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "OUTPUT=PixelCraft-${version}-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Package AppImage
        shell: bash
        run: |
          mkdir -p dist AppDir/usr/share/doc/pixelcraft
          install -m 644 LICENSE AppDir/usr/share/doc/pixelcraft/LICENSE
          install -m 644 assets/fonts/LICENSE AppDir/usr/share/doc/pixelcraft/FONT-LICENSE.txt
          install -m 644 /usr/share/doc/libwebpdemux2/copyright AppDir/usr/share/doc/pixelcraft/WEBP-COPYRIGHT.txt
          desktop-file-validate packaging/pixelcraft.desktop
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output "$RUNNER_TEMP/linuxdeploy.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy.AppImage"
          # X11 is loaded dynamically. Wayland must come from the host, together
          # with its Mesa/EGL drivers, to avoid mixing incompatible Wayland ABIs.
          "$RUNNER_TEMP/linuxdeploy.AppImage" --appdir AppDir \
            --executable target/release/pixelcraft \
            --desktop-file packaging/pixelcraft.desktop \
            --icon-file packaging/pixelcraft.png \
            --library /usr/lib/x86_64-linux-gnu/libX11.so.6 \
            --library /usr/lib/x86_64-linux-gnu/libwebpdemux.so.2 \
            --exclude-library 'libwayland-*.so*' \
            --library /usr/lib/x86_64-linux-gnu/libxkbcommon.so.0 \
            --library /usr/lib/x86_64-linux-gnu/libxkbcommon-x11.so.0 \
            --output appimage
          # Also catch accidental/transitive bundling, including symlinks.
          bundled_wayland=$(find AppDir -name 'libwayland-*.so*' -print)
          if [[ -n "$bundled_wayland" ]]; then
            echo "Wayland libraries must be supplied by the host:" >&2
            printf '%s\n' "$bundled_wayland" >&2
            exit 1
          fi
          mv "$OUTPUT" dist/

      - name: Smoke test packaged app and create checksum
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-appimage-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/pixelcraft-appimage-config
        shell: bash
        run: |
          chmod +x "dist/$OUTPUT"
          "dist/$OUTPUT" --standalone-check "$RUNNER_TEMP/pixelcraft-appimage-check"
          cd dist
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

      - name: Build the Linux tarball and Debian package
        run: |
          app_version=$(cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "pixelcraft"))')
          bash packaging/build-linux-tarball.sh AppDir dist "$VERSION"
          bash packaging/build-linux-deb.sh target/release/pixelcraft dist "$VERSION" "$app_version"
      - name: Verify tarball and Debian package startup and WebP
        run: |
          bash checks/linux-packages.sh \
            "dist/PixelCraft-$VERSION-linux-x86_64.tar.gz" \
            "dist/PixelCraft-$VERSION-linux-amd64.deb" \
            "$RUNNER_TEMP/startup-linux-packages"

      - name: Graphical startup on X11
        shell: bash
        run: |
          env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x960x24 +extension GLX' \
            bash checks/graphical-startup.sh "dist/$OUTPUT" "$RUNNER_TEMP/startup-x11"

      - name: Graphical startup on native Wayland
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/pixelcraft-wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=pixelcraft-test
          weston --backend=headless-backend.so --use-gl --no-config \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 --width=1280 --height=960 \
            --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do
            [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/weston.log"
              exit 1
            fi
            sleep 0.1
          done
          if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
            cat "$RUNNER_TEMP/weston.log"
            echo 'Wayland compositor did not become ready.' >&2
            exit 1
          fi
          # Removing DISPLAY prevents a successful X11 fallback hiding a failure.
          env -u DISPLAY -u WAYLAND_SOCKET bash checks/graphical-startup.sh \
            "dist/$OUTPUT" "$RUNNER_TEMP/startup-wayland"

      - name: Upload graphical startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-startup-diagnostics
          path: |
            ${{ runner.temp }}/startup-x11/startup.*
            ${{ runner.temp }}/startup-wayland/startup.*
            ${{ runner.temp }}/startup-linux-packages/*/startup/startup.*
            ${{ runner.temp }}/startup-linux-packages/*/webp.*
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      PIXELCRAFT_REPOSITORY: ${{ github.repository }}
      # Statically link the MSVC runtime so a separate redistributable is unnecessary.
      RUSTFLAGS: '-C target-feature=+crt-static'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup override set 1.95.0
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed' }
      - name: Restore Windows build cache
        uses: actions/cache/restore@v4
        with:
          path: target
          key: windows-target-v1-${{ hashFiles('Cargo.lock') }}
      - name: Build static Windows WebP
        run: ./packaging/build-windows-webp.ps1
      - name: Test and build Windows release
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-native-data
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          python checks/no-lua-runtime.py target/release/pixelcraft.exe
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected Lua runtime payload' }
      - name: Save Windows build cache
        uses: actions/cache/save@v4
        with:
          path: target
          key: windows-target-v1-${{ hashFiles('Cargo.lock') }}
      - name: Strict lint and native clipboard on Windows
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-clipboard-data
        run: |
          python checks/workspace-boundaries.py
          if ($LASTEXITCODE -ne 0) { throw 'Workspace boundaries failed' }
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo clippy --workspace --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Strict lint failed' }
          cargo test --locked -p pixelcraft-desktop --lib native_clipboard_roundtrip -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native clipboard failed' }
          cargo test --locked -p pixelcraft-desktop --lib packed_tilemap_cross_process_roundtrip -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Packed clipboard failed' }
          ./checks/graphics-fallback.ps1

      - name: Upload Windows startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Windows-startup-review
          path: |
            ${{ runner.temp }}/pixelcraft-fallback/*.log
            ${{ runner.temp }}/pixelcraft-fallback/*.png
          if-no-files-found: warn
      - name: Check Windows UI themes, scaling, accessibility and keyboard navigation
        env:
          PIXELCRAFT_HOME: ${{ runner.temp }}/pixelcraft-ui-data
          PIXELCRAFT_UI_REVIEW_DIR: ${{ runner.temp }}/pixelcraft-ui-review
        run: |
          cargo test --locked -p pixelcraft-desktop --lib ui_icon_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Windows UI checks failed' }
      - name: Upload Windows UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Windows-UI-review
          path: ${{ runner.temp }}/pixelcraft-ui-review/*.png
          if-no-files-found: warn
      - name: Package Windows installer
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read app version' }
          $appVersion = ($metadata.packages | Where-Object name -eq pixelcraft).version
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'manual-' + $env:GITHUB_SHA.Substring(0,7) }
          $version = $version -replace '[^A-Za-z0-9._-]', '-'
          $output = "PixelCraft-$version-x86_64-Setup"
          "OUTPUT=$output.exe" >> $env:GITHUB_ENV
          "PORTABLE=PixelCraft-$version-x86_64-Portable.exe" >> $env:GITHUB_ENV
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is missing from the Windows runner' }
          & $compiler "/DAppVersion=$appVersion" "/DOutputName=$output" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify installed app, uninstall and checksum
        run: ./checks/windows-installer.ps1 -Installer "dist/$env:OUTPUT"
      - name: Package and smoke-test the portable executable
        run: |
          $portable = "dist/$env:PORTABLE"
          Copy-Item -LiteralPath 'target/release/pixelcraft.exe' -Destination $portable
          ./checks/windows-portable.ps1 -App $portable
          $hash = (Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:PORTABLE" | Set-Content "$portable.sha256" -Encoding ascii
          $notices = @('LICENSE', 'assets/fonts/LICENSE',
              'runtime/webp/WEBP-COPYING.txt', 'runtime/webp/WEBP-PATENTS.txt', 'runtime/webp/WEBP-AUTHORS.txt')
          $notices | ForEach-Object { "---- $_"; Get-Content -LiteralPath $_; "" } |
              Set-Content "$portable-LICENSES.txt" -Encoding utf8
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelCraft-Windows-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    uses: ./.github/workflows/macos-build.yml

  publish:
    needs: [appimage, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PixelCraft-Linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: PixelCraft-Windows-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: PixelCraft-macOS-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: PixelCraft-macOS-x86_64
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "PixelCraft $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
