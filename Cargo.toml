[package]
name = "pixelcraft"
version.workspace = true
edition = "2024"
authors = ["Asad"]
license = "MIT"

[workspace]
members = ["crates/pixelcraft-core", "crates/pixelcraft-automation", "crates/pixelcraft-cli", "crates/pixelcraft-mcp", "crates/pixelcraft-desktop", "crates/pixelcraft-ffi"]
default-members = [".", "crates/pixelcraft-core", "crates/pixelcraft-automation", "crates/pixelcraft-cli", "crates/pixelcraft-mcp", "crates/pixelcraft-desktop", "crates/pixelcraft-ffi"]
resolver = "3"

[workspace.package]
version = "0.11.0"

[dependencies]
pixelcraft-core = { path = "crates/pixelcraft-core" }
pixelcraft-automation = { path = "crates/pixelcraft-automation" }
pixelcraft-cli = { path = "crates/pixelcraft-cli" }
pixelcraft-mcp = { path = "crates/pixelcraft-mcp" }
pixelcraft-desktop = { path = "crates/pixelcraft-desktop" }

[dev-dependencies]
moxcms = "0.8.1"
png = "0.18.1"
roxmltree = "0.20.0"
base64 = "0.23.1"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "jpeg", "ico", "qoi", "tga", "webp"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
sha2 = "0.10.9"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 2
strip = true

# Security-patched upstream releases, vendored for reproducible offline builds.
[patch.crates-io]
rustls = { path = "vendor/rustls-0.23.46" }
rustls-webpki = { path = "vendor/rustls-webpki-0.103.16" }
webpki-root-certs = { path = "vendor/webpki-root-certs-1.0.10" }
