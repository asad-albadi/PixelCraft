[package]
name = "pixelcraft-core"
version.workspace = true
edition = "2024"
license = "MIT"

[dependencies]
emath = "0.36.2"
sha2 = "0.10.9"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "jpeg", "ico", "qoi", "tga", "webp"] }
color_quant = "1.1.0"
flate2 = "1.1.10"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
libloading = "0.8.8"
png = "0.18.1"
moxcms = "0.8.1"
roxmltree = "0.20.0"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_ColorSystem", "Win32_UI_WindowsAndMessaging"] }
