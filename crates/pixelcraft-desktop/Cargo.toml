[package]
name = "pixelcraft-desktop"
version.workspace = true
edition = "2024"
authors = ["Asad"]
license = "MIT"

[dependencies]
pixelcraft-core = { path = "../pixelcraft-core" }
pixelcraft-automation = { path = "../pixelcraft-automation" }
pixelcraft-cli = { path = "../pixelcraft-cli" }
pixelcraft-mcp = { path = "../pixelcraft-mcp" }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wgpu", "x11", "wayland"] }
arboard = "3.6.1"
sha2 = "0.10.9"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "jpeg", "ico", "qoi", "tga", "webp"] }
rfd = "0.17.2"
color_quant = "1.1.0"
flate2 = "1.1.10"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
libloading = "0.8.8"
png = "0.18.1"
moxcms = "0.8.1"
roxmltree = "0.20.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
semver = "1.0.28"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_ColorSystem", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["tiff"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphicsContext"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wl-clipboard-rs = "0.9.5"
zbus = "5.19.0"
x11rb = { version = "0.13.2", features = ["randr"] }

