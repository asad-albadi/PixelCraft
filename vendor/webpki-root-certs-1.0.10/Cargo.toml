# Standalone equivalent of upstream workspace manifest. Dev-only dependencies
# and tests are omitted; the published library and its runtime dependency match.
[package]
name = "webpki-root-certs"
version = "1.0.10"
edition = "2021"
rust-version = "1.71"
readme = "README.md"
license = "CDLA-Permissive-2.0"
homepage = "https://github.com/rustls/webpki-roots"
repository = "https://github.com/rustls/webpki-roots"
description = "Mozilla trusted certificate authorities in self-signed X.509 format for use with crates other than webpki"

[dependencies]
pki-types = { package = "rustls-pki-types", version = "1.8", default-features = false }
